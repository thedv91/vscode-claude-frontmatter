name: Release

# Publishing is gated on a tag you push deliberately, never on a branch push.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      - run: bun run check

      - name: Fail if the tag does not match the manifest version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          MANIFEST="v$(node -p "require('./package.json').version")"
          [ "$TAG" = "$MANIFEST" ] || {
            echo "tag $TAG does not match package.json $MANIFEST" >&2
            exit 1
          }

      - run: bunx @vscode/vsce package --no-dependencies

      # A version can already be up because it was uploaded by hand, or because
      # this release is being re-run. Neither is an error, and the Marketplace
      # refuses to overwrite a version, so ask before trying.
      - name: Check whether this version is already published
        id: published
        run: echo "already=$(node scripts/is-published.mjs)" >> "$GITHUB_OUTPUT"

      - name: Publish to the VS Code Marketplace
        if: steps.published.outputs.already != 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT is not set. Add it as a repository secret — see the Publishing section of the README." >&2
            exit 1
          fi
          bunx @vscode/vsce publish --no-dependencies --packagePath ./*.vsix

      - name: Note the skipped publish
        if: steps.published.outputs.already == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: echo "::notice::$TAG is already on the Marketplace; publish skipped."

      - name: Attach the vsix to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" ./*.vsix --generate-notes

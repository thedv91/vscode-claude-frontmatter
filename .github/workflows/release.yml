name: Release

# Publishing is gated on a tag you push deliberately, never on a branch push.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      - run: bun run check

      - name: Fail if the tag does not match the manifest version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          MANIFEST="v$(node -p "require('./package.json').version")"
          [ "$TAG" = "$MANIFEST" ] || {
            echo "tag $TAG does not match package.json $MANIFEST" >&2
            exit 1
          }

      - run: bunx @vscode/vsce package --no-dependencies

      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: bunx @vscode/vsce publish --no-dependencies --packagePath *.vsix

      - name: Attach the vsix to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" ./*.vsix --generate-notes

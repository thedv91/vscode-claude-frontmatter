name: Release

# Publishing is gated on a tag you push deliberately, never on a branch push.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      - run: bun run check

      - name: Fail if the tag does not match the manifest version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          MANIFEST="v$(node -p "require('./package.json').version")"
          [ "$TAG" = "$MANIFEST" ] || {
            echo "tag $TAG does not match package.json $MANIFEST" >&2
            exit 1
          }

      - run: bunx @vscode/vsce package --no-dependencies

      # A version can already be up because it was uploaded by hand, or because
      # this release is being re-run. Neither is an error, and neither registry
      # will overwrite a version, so ask before trying.
      - name: Check the registries for this version
        id: published
        run: |
          {
            echo "marketplace=$(node scripts/is-published.mjs)"
            echo "openvsx=$(node scripts/is-published.mjs --ovsx)"
          } >> "$GITHUB_OUTPUT"

      # A missing VSCE_PAT warns rather than fails: minting one needs an Azure
      # DevOps organization, and creating an organization now requires an Azure
      # subscription. Until that is sorted the vsix attached to the GitHub
      # release below is uploaded to the Marketplace by hand, and a release must
      # still end green. Adding the secret revives this step with no other edit.
      - name: Publish to the VS Code Marketplace
        if: steps.published.outputs.marketplace != 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::warning::VSCE_PAT is not set; skipping the Marketplace. Upload the vsix attached to this release by hand at https://marketplace.visualstudio.com/manage — see the Publishing section of CONTRIBUTING.md."
            exit 0
          fi
          bunx @vscode/vsce publish --no-dependencies --packagePath ./*.vsix

      # Cursor, Windsurf, VSCodium and Gitpod read Open VSX rather than the
      # Microsoft Marketplace, which does not serve non-VS Code products.
      - name: Publish to Open VSX
        if: steps.published.outputs.openvsx != 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          PUBLISHER: ${{ vars.PUBLISHER || 'thedv91' }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::warning::OVSX_PAT is not set; skipping Open VSX. Cursor and VSCodium users will not see this release."
            exit 0
          fi
          # create-namespace fails once the namespace exists, so only call it
          # when the registry does not know it yet.
          if ! curl -sfo /dev/null "https://open-vsx.org/api/$PUBLISHER"; then
            bunx ovsx create-namespace "$PUBLISHER" -p "$OVSX_PAT"
          fi
          bunx ovsx publish ./*.vsix -p "$OVSX_PAT"

      - name: Note anything skipped
        env:
          TAG: ${{ github.ref_name }}
          MARKETPLACE: ${{ steps.published.outputs.marketplace }}
          OPENVSX: ${{ steps.published.outputs.openvsx }}
        run: |
          [ "$MARKETPLACE" = "true" ] && echo "::notice::$TAG already on the Marketplace; publish skipped."
          [ "$OPENVSX" = "true" ] && echo "::notice::$TAG already on Open VSX; publish skipped."
          exit 0

      - name: Attach the vsix to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" ./*.vsix --generate-notes || gh release upload "$TAG" ./*.vsix --clobber

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # `smoke` runs the built bundle under Node, so both runtimes are needed.
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      - run: bun run check

      - name: Fail if the emitted JSON Schemas are stale
        run: |
          bun run schema:emit
          git diff --exit-code -- schemas/

      - run: bunx @vscode/vsce package --no-dependencies

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: '*.vsix'
